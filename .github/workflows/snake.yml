# Plays Snake on my contribution graph and publishes the two SVGs (light and
# dark) to the "output" branch, where README.md loads them from. Runs once a
# day, on every push to main, and on demand from the Actions tab.
name: Snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Test the snake's path planning
        run: python3 -m unittest discover -s snake -v

      - name: Play Snake on my contribution graph
        run: python3 snake/snake_game.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
